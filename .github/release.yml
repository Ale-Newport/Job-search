# Categories for automatically generated release notes (gh release create --generate-notes).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Security
      labels: [security]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Improvements
      labels: [improvement, performance, accessibility]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
