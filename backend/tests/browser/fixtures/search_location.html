<!doctype html><meta charset="utf-8"><title>Searchable current location</title>
<style>body{font:16px sans-serif;padding:30px}label{display:block;margin:16px}input,button{padding:10px}[role=option]{padding:10px;cursor:pointer}</style>
<form onsubmit="event.preventDefault();window.submissions++">
<label>Email<input type="email" name="email" required></label>
<label>Current location<input id="location" role="combobox" aria-controls="places" aria-expanded="false" required></label>
<button type="submit">Submit application</button></form><div id="portal"></div>
<script>
window.submissions=0;window.queries=[];
const input=document.querySelector('#location'), portal=document.querySelector('#portal');
const alternate=new URLSearchParams(location.search).has('alternate');
let choices=alternate ? ['London, Ontario, Canada','London (UK)','London, Greater London, England'] : ['London, Ontario, Canada','London, Greater London, England, United Kingdom','London (UK)'];
if(new URLSearchParams(location.search).has('single_uk_label'))choices=choices.slice(0,2);
const render=search=>{window.queries.push(search);input.setAttribute('aria-expanded','true');portal.innerHTML='<div id="places" role="listbox"></div>';
 if(search.toLowerCase()!=='london') return;
 for(const label of choices){const option=document.createElement('div');option.role='option';option.id=crypto.randomUUID();option.textContent=label;
 option.onclick=()=>{input.value=label;input.setAttribute('aria-expanded','false');portal.innerHTML='';};portal.firstChild.append(option);}};
input.oninput=()=>render(input.value);
</script>
