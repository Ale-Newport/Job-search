<!doctype html><meta charset="utf-8"><title>Location menu with separate search</title>
<style>body{font:16px sans-serif;padding:30px}label{display:block;margin:16px}input,button{padding:10px}[role=option]{padding:10px;cursor:pointer}</style>
<form onsubmit="event.preventDefault();window.submissions++">
<label>Email<input type="email" name="email" required></label>
<button type="button" id="location" role="combobox" aria-label="Current location" aria-required="true" aria-controls="places" aria-expanded="false">Choose location</button>
<button type="submit">Submit application</button></form><div id="portal"></div>
<script>
window.submissions=0;window.queries=[];
const combo=document.querySelector('#location'),portal=document.querySelector('#portal');
combo.onclick=()=>{combo.setAttribute('aria-expanded','true');portal.innerHTML='<input type="search" role="searchbox" aria-label="Search current location"><div role="listbox" id="places"></div>';
 portal.firstChild.oninput=e=>{window.queries.push(e.target.value);const list=portal.lastChild;list.innerHTML='';
 if(e.target.value.toLowerCase()!=='london')return;
 for(const value of ['London, Ontario, Canada','London (UK)']){const option=document.createElement('div');option.role='option';option.textContent=value;
 option.onclick=()=>{combo.setAttribute('aria-valuetext',value);combo.setAttribute('aria-expanded','false');portal.innerHTML='';};list.append(option);}};};
</script>
