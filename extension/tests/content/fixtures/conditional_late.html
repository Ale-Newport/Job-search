<!doctype html><html lang="en"><meta charset="utf-8"><title>A follow-up question revealed late</title>
<style>body{font:16px system-ui;padding:24px;max-width:720px}label{display:block;margin:10px 0}</style>
<h1>Application</h1>
<form onsubmit="event.preventDefault()">
<label>Full name <input name="full_name"></label>
<label>Do you require visa sponsorship?
  <select name="sponsor" id="sponsor"><option value="">Select</option><option value="yes">Yes</option><option value="no">No</option></select></label>
<div id="cond" hidden><label>Please describe your visa situation <input name="visa_detail"></label></div>
<label>Nickname <input name="nickname"></label>
<button type="button">Next</button>
</form>
<script>
// the follow-up renders 900 ms AFTER the choice (an async framework): the scan that sees the new selection and the scan that sees
// the new question are different scans
document.getElementById('sponsor').addEventListener('change', (e) => {
  const show = e.target.value === 'yes';
  setTimeout(() => { document.getElementById('cond').hidden = !show; }, 900);
});
</script></html>
