<!doctype html><html lang="en"><meta charset="utf-8"><title>A field a layer covers after the scan</title>
<style>body{font:16px system-ui;padding:24px;max-width:720px}label{display:block;margin:12px 0}#wrap{position:relative}</style>
<h1>Application</h1>
<form onsubmit="event.preventDefault()">
<label>First name <input name="first_name"></label>
<div id="wrap"><label>Email <input name="email" type="email"></label></div>
<label>Phone <input name="phone"></label>
<button type="submit">Submit application</button>
</form>
<script>
// an opaque layer over the email field AFTER the page was scanned: the field stays in the walk (it was seen), but nobody can see it now
window.coverEmail = () => {
  const d = document.createElement('div');
  d.id = 'cover';
  d.style.cssText = 'position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;z-index:5';
  document.getElementById('wrap').append(d);
};
window.uncover = () => document.getElementById('cover')?.remove();
</script>
</html>
