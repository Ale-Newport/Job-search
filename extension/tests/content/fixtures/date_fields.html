<!doctype html><html lang="en"><meta charset="utf-8"><title>Native date and time inputs</title>
<style>body{font:16px system-ui;padding:24px;max-width:720px}label{display:block;margin:12px 0}</style>
<h1>Application: dates</h1>
<form onsubmit="event.preventDefault()">
<label>Expected salary <input name="salary"></label>
<label>When can you start? <input type="date" name="start"></label>
<label>Preferred call time <input type="time" name="slot"></label>
<label>Nickname <input name="nickname"></label>
<button type="submit">Submit application</button>
</form>
</html>
