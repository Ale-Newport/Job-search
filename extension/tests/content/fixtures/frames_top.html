<!doctype html><html lang="en"><meta charset="utf-8"><title>Application with an embedded form</title>
<style>body{font:16px system-ui;padding:24px;max-width:900px}label{display:block;margin:10px 0}</style>
<h1>Apply: Platform Engineer</h1>
<form id="top" onsubmit="event.preventDefault();window.submissions=(window.submissions||0)+1">
<label>First name <input name="first_name"></label>
<iframe id="embed" title="Contact details" src="{{ALT}}/frames_child.html" style="width:800px;height:260px;border:1px solid #ccc"></iframe>
<label>Cover note <textarea name="cover" rows="3"></textarea></label>
<button type="submit">Submit application</button>
</form></html>
