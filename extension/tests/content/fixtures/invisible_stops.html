<!doctype html><html lang="en"><meta charset="utf-8"><title>Controls nobody can see between two fields</title>
<style>body{font:16px system-ui;padding:24px;max-width:720px}label{display:block;margin:12px 0}</style>
<h1>Application</h1>
<form onsubmit="event.preventDefault()">
<label>First name <input name="first_name"></label>
<!-- the browser's own Tab would stop on each of these; a person cannot see any of them -->
<input name="x_opacity" aria-label="opacity" style="opacity:0">
<div style="filter:opacity(0)"><input name="x_filter" aria-label="filter"></div>
<div style="position:relative"><input name="x_covered" aria-label="covered"><div style="position:absolute;left:0;top:0;right:0;bottom:0;background:#fff"></div></div>
<div style="clip-path:inset(100%)"><input name="x_clipped" aria-label="clipped"></div>
<input name="x_far" aria-label="far" style="position:absolute;left:6000px;top:10px">
<label>Last name <input name="last_name"></label>
<label>Email <input name="email" type="email"></label>
<button type="submit">Submit application</button>
</form>
</html>
