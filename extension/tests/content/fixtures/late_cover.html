<!doctype html><html lang="en"><meta charset="utf-8"><title>A layer that never takes a click comes after the scan</title>
<style>body{font:16px system-ui;padding:24px;max-width:720px}.row{margin:12px 0}.rel{position:relative;width:320px;height:34px}.rel input{position:absolute;left:0;top:0;width:300px;height:30px;box-sizing:border-box}</style>
<h1>Apply</h1>
<form onsubmit="event.preventDefault()">
<div class="row"><label for="first">First name</label><div class="rel" id="w_first"><input id="first" name="first_name"></div></div>
<div class="row"><label for="email">Email</label><div class="rel" id="w_email"><input id="email" name="email" type="email"></div></div>
<div class="row"><label for="phone">Phone</label><div class="rel" id="w_phone"><input id="phone" name="phone" type="tel"></div></div>
<div class="row"><label for="cv">Resume/CV</label><div class="rel" id="w_cv"><input id="cv" name="cv" type="file"></div></div>
</form>
<script>
// an opaque layer that takes no click, over a field, AFTER the page was scanned (nothing says it came)
window.coverLater = (id, how) => {
  const w = document.getElementById('w_' + id);
  const d = document.createElement(how === 'p' ? 'p' : 'div');
  d.className = 'late-cover'; d.id = 'cover_' + id;
  d.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;margin:0;background:#fff;pointer-events:none;z-index:5';
  if (how === 'popover') { d.setAttribute('popover', 'manual'); d.style.cssText = 'position:fixed;inset:auto;margin:0;border:0;padding:0;background:#fff;pointer-events:none'; const r = w.getBoundingClientRect(); d.style.left = r.left + 'px'; d.style.top = r.top + 'px'; d.style.width = r.width + 'px'; d.style.height = r.height + 'px'; document.body.append(d); d.showPopover(); return; }
  if (how === 'strong') {
    // a page rule that outranks any selector with fewer than six ids (a scan's rule): only a write's rule (a cascade layer) beats it
    const rule = document.createElement('style');
    rule.textContent = `${`#cover_${id}`.repeat(6)} { pointer-events: none !important; }`;
    d.style.pointerEvents = '';
    document.head.append(rule);
    d.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;margin:0;background:#fff;z-index:5';
  }
  w.append(d);
};
window.uncover = (id) => { const d = document.getElementById('cover_' + id); try { d.hidePopover(); } catch (e) {} d?.remove(); };
</script>
</html>
