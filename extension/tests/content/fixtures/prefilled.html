<!doctype html><html lang="en"><meta charset="utf-8"><title>Prefilled form</title>
<style>body{font:16px system-ui;padding:24px;max-width:720px}label{display:block;margin:10px 0}</style>
<form onsubmit="event.preventDefault()">
<label>First name <input name="first_name" value="PREFILLED-SECRET-ONE"></label>
<label>Last name <input name="last_name"></label>
<label>Email <input name="email" type="email"></label>
<label>Notes <textarea name="notes">PREFILLED-SECRET-TWO notes</textarea></label>
<label>Country <select name="country"><option value="">Select</option><option value="gb" selected>United Kingdom</option><option value="es">Spain</option></select></label>
<label>Phone <input name="phone"></label>
</form></html>
