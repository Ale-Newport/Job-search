<!doctype html><html lang="en"><meta charset="utf-8"><title>Choice groups with inline labels</title>
<style>
body{font:16px system-ui;padding:24px;max-width:900px}
fieldset{margin:16px 0}
.opt{display:inline-block;margin-right:18px}
.opt label{display:inline}
.col div{margin:6px 0}
</style>
<h1>Application: choices</h1>
<form onsubmit="event.preventDefault()">
<label>Full name <input name="full_name"></label>
<fieldset><legend>Do you require visa sponsorship?</legend>
  <span class="opt"><input type="radio" id="s_yes" name="sponsor" value="yes"><label for="s_yes">Yes</label></span>
  <span class="opt"><input type="radio" id="s_no" name="sponsor" value="no"><label for="s_no">No</label></span>
  <span class="opt"><input type="radio" id="s_na" name="sponsor" value="na"><label for="s_na">Prefer not to say</label></span>
</fieldset>
<fieldset class="col"><legend>Which languages do you speak?</legend>
  <div><input type="checkbox" id="l_en" name="lang" value="en"><label for="l_en">English</label></div>
  <div><input type="checkbox" id="l_es" name="lang" value="es"><label for="l_es">Spanish</label></div>
  <div><input type="checkbox" id="l_de" name="lang" value="de"><label for="l_de">German</label></div>
</fieldset>
<label>Expected salary <input name="salary"></label>
<button type="submit">Submit application</button>
</form>
</html>
