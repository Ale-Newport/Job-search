<!doctype html><html lang="en"><meta charset="utf-8"><title>Single page application wizard</title>
<link rel="canonical" href="{{MAIN}}/jobs/platform-engineer">
<style>body{font:16px system-ui;padding:24px;max-width:720px}label{display:block;margin:10px 0}</style>
<h1 id="h">Platform Engineer</h1>
<div id="step"></div>
<script>
history.replaceState({}, '', '/spa.html#/apply/step1');
function render(n) {
  const el = document.getElementById('step');
  if (n === 1) el.innerHTML = '<form onsubmit="return false"><label>First name <input name="first_name"></label><label>Last name <input name="last_name"></label><button type="button" id="next">Next</button></form>';
  else el.innerHTML = '<form onsubmit="return false"><label>Email <input name="email" type="email"></label><label>Phone <input name="phone"></label><button type="button">Submit application</button></form>';
  if (n === 1) document.getElementById('next').onclick = () => { history.pushState({}, '', '/spa.html#/apply/step2'); render(2); };
}
render(1);
window.gotoJob = (path) => {
  history.pushState({}, '', path);
  document.querySelector('link[rel=canonical]').href = location.origin + path;
  document.getElementById('h').textContent = 'Another Job'; render(2);
};
</script></html>
