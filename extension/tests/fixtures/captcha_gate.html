<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply - Acme Robotics (verification)</title>
<link rel="stylesheet" href="/_base.css">
<script src="/_guard.js"></script>
</head>
<body>
<header class="site"><span class="brand">Acme Robotics</span></header>
<main>
<h1>Software Engineer application</h1>
<p>Please complete the security check below before continuing.</p>
<form id="gate_form" action="#" novalidate>
  <div class="field"><label for="first_name">First name</label><input type="text" id="first_name" name="first_name"></div>
  <div class="field"><label for="email">Email</label><input type="email" id="email" name="email"></div>
  <!-- A VISIBLE challenge widget: the whole page must be left alone until the human has solved it. -->
  <iframe title="reCAPTCHA challenge" width="304" height="78" src="/recaptcha/api2/anchor?size=normal"></iframe>
  <p><button type="submit" id="submit_app" data-submit>Submit application</button></p>
</form>
</main>
<script>document.getElementById('gate_form').addEventListener('submit', (event) => event.preventDefault());</script>
</body>
</html>
