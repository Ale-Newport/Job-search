<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account - Acme Robotics Careers</title>
<link rel="stylesheet" href="/_base.css">
<script src="/_guard.js"></script>
</head>
<body>
<header class="site"><span class="brand">Acme Robotics Careers</span></header>
<main>
<h1>Create your candidate account</h1>
<form id="signup_form" action="#" novalidate>
  <div class="field"><label for="signup_email">Email address</label>
    <input type="email" id="signup_email" name="email" autocomplete="username"></div>
  <div class="field"><label for="signup_password">Password</label>
    <input type="password" id="signup_password" name="password" autocomplete="new-password"></div>
  <div class="field"><label for="signup_verify">Verify new password</label>
    <input type="password" id="signup_verify" name="verify_password" autocomplete="new-password"></div>
  <div class="field"><label class="inline"><input type="checkbox" id="signup_terms" name="terms">
    I have read and accept the candidate terms.</label></div>
  <p><button type="submit" id="submit_app" data-submit>Create Account</button></p>
  <p class="hint">Already have an account? <a href="#signin">Sign in</a></p>
</form>
</main>
<script>document.getElementById('signup_form').addEventListener('submit', (event) => event.preventDefault());</script>
</body>
</html>
