<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your details - Acme Robotics</title>
<link rel="stylesheet" href="/_base.css">
<script src="/_guard.js"></script>
</head>
<body>
<header class="site"><span class="brand">Acme Robotics</span></header>
<main>
<h1>Your details</h1>
<p class="hint">Some fields were pre-filled from an earlier visit.</p>
<form id="prefilled_form" action="#" novalidate>
  <div class="field"><label for="first_name">First name</label>
    <input type="text" id="first_name" name="first_name" value="Alexander"></div>
  <div class="field"><label for="last_name">Last name</label>
    <input type="text" id="last_name" name="last_name" value="Morgan"></div>
  <div class="field"><label for="email">Email</label>
    <input type="email" id="email" name="email"></div>
  <div class="field"><label for="country">Country of residence</label>
    <select id="country" name="country"><option value="">Select an option</option><option value="ES">Spain</option>
      <option value="GB">United Kingdom</option></select></div>
  <div class="field"><label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone"></div>
  <p><button type="submit" id="submit_app" data-submit>Continue</button></p>
</form>
</main>
<script>document.getElementById('prefilled_form').addEventListener('submit', (event) => event.preventDefault());</script>
</body>
</html>
