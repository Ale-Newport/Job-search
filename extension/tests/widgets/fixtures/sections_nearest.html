<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sections: the nearest heading above a control</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<h1>Sections</h1>
<section id="s1"><h2>Personal information</h2>
  <div class="field"><label for="a_name">Name</label><input type="text" id="a_name" name="a_name"></div>
  <div class="field"><label for="a_phone">Phone</label><input type="tel" id="a_phone" name="a_phone"></div>
  <div class="section-title" id="t2">Emergency contact</div>
  <div class="field"><label for="b_name">Name</label><input type="text" id="b_name" name="b_name"></div>
  <div class="field"><label for="b_phone">Phone</label><input type="tel" id="b_phone" name="b_phone"></div>
  <p id="t3"><strong>Referee</strong></p>
  <div class="field"><label for="c_name">Name</label><input type="text" id="c_name" name="c_name"></div>
  <div class="field"><label for="c_email">Email</label><input type="email" id="c_email" name="c_email"></div>
</section>
<script src="common.js"></script>
</body>
</html>
